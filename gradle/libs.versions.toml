hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hilt-navigation" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hilt-navigation" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose-android", version.ref = "maplibre-compose" }
maplibre-android = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }
androidx-test-core = { module = "androidx.test:core", version = "1.6.1" }
androidx-junit = { module = "androidx.test.ext:junit", version = "1.2.1" }
secp256k1 = { module = "fr.acinq.secp256k1:secp256k1-kmp", version = "0.22.0" }
